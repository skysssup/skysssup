<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-label="Sky">
  <!-- quiet geometric wordmark. no mascot. -->
  <rect width="1200" height="280" fill="#11100e"/>

  <!-- faint grid, imperfect -->
  <g stroke="#1c1b18" stroke-width="1" fill="none">
    <path d="M0 70 H1200"/>
    <path d="M0 140 H1200"/>
    <path d="M0 210 H1200"/>
    <path d="M200 0 V280"/>
    <path d="M400 0 V280"/>
    <path d="M600 0 V280"/>
    <path d="M800 0 V280"/>
    <path d="M1000 0 V280"/>
  </g>

  <!-- geometric SKY — letterforms from bars, slightly uneven gaps -->
  <g fill="#e8e2d6">
    <!-- S -->
    <rect x="72" y="78" width="78" height="14"/>
    <rect x="72" y="78" width="14" height="42"/>
    <rect x="72" y="120" width="78" height="14"/>
    <rect x="136" y="120" width="14" height="42"/>
    <rect x="72" y="148" width="78" height="14"/>

    <!-- K -->
    <rect x="198" y="78" width="14" height="84"/>
    <rect x="212" y="113" width="36" height="14"/>
    <polygon points="236,78 252,78 228,120 212,120"/>
    <polygon points="212,120 228,120 252,162 236,162"/>

    <!-- Y -->
    <polygon points="290,78 306,78 328,118 328,162 314,162 314,118 304,102"/>
    <polygon points="366,78 350,78 328,118 314,118 314,102 340,78"/>
  </g>

  <!-- thin accent rule, off-center -->
  <rect x="72" y="196" width="168" height="3" fill="#d4530c"/>

  <!-- monospace tagline -->
  <text x="72" y="232" fill="#8a8478" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" letter-spacing="1.5">local first · weird uis</text>

  <!-- small corner mark -->
  <g stroke="#3a3832" stroke-width="1.5" fill="none">
    <path d="M1120 48 H1160 V88"/>
    <path d="M1160 232 H1120 V192"/>
  </g>
</svg>
